<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="style.css">
    <script src="pes.js" defer></script>
</head>
<body>
    <div class="tata-letak-grid">
        <aside class="bilah-samping" aria-label="Bilah samping">
            <a class="kotak-logo" href="#" aria-label="Nama aplikasi">
                <span class="teks-logo">Nama Aplikasi</span>
            </a>
            <nav class="navigasi-samping" aria-label="Navigasi utama">
                <ul class="daftar-navigasi">
                    <li><a class="kotak-navigasi aktif" href="#">Menu 1</a></li>
                    <li><a class="kotak-navigasi" href="#">Menu 2</a></li>
                    <li><a class="kotak-navigasi" href="#">Menu 3</a></li>
                    <li><a class="kotak-navigasi" href="#">Menu 4</a></li>
                </ul>
            </nav>
            <div class="kotak-samping-bawah">
                <p>Area informasi</p>
            </div>
        </aside>

        <main class="konten-utama">
            <header class="kepala-halaman">
                <div class="kotak-kepala">
                    <p class="label-halaman">Nama halaman</p>
                    <h1>Judul Dashboard</h1>
                    <p class="deskripsi-halaman">Deskripsi singkat halaman.</p>
                </div>
                <div class="kotak-aksi-kepala" aria-hidden="true"></div>
            </header>

            <section class="wadah-statistik" aria-label="">
                <div class="kartu-statistik" aria-hidden="true"></div>
                <div class="kartu-statistik" aria-hidden="true"></div>
                <div class="kartu-statistik" aria-hidden="true"></div>
            </section>

            <div class="baris-panel">
                <section class="wadah-panel panel-utama" aria-label="">
                    <div class="kotak-isi-panel" aria-hidden="true"></div>
                </section>
                <section class="wadah-panel panel-samping" aria-label="">
                    <div class="kotak-isi-panel" aria-hidden="true"></div>
                </section>
            </div>

            <section class="wadah-panel panel-bawah" aria-label="">
                <div class="kotak-isi-panel" aria-hidden="true"></div>
            </section>
        </main>
    </div>
</body>
</html>
